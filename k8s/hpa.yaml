apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: violation-api-hpa
  labels:
    app: violation-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: violation-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
